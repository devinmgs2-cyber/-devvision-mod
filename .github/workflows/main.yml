  -  - name: Setup .NET SDK
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: '7.0.x'

  - name: Restore
    run: dotnet restore DevVision.csproj

  - name: Build (Release)
    run: dotnet build DevVision.csproj --configuration Release --no-restore

  - name: List files (debug)
    run: dir /s /b

  - name: Upload artifact
    uses: actions/upload-artifact@v4
    with:
      name: DevVision-dll
      path: '**/bin/**/Release/*.dll'
